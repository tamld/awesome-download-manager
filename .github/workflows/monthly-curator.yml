name: Monthly Awesome Curator

on:
  schedule:
    - cron: '0 0 1 * *' # Run on the 1st day of each month
  workflow_dispatch:     # Allow manual on-demand execution

permissions:
  contents: write
  pull-requests: write

jobs:
  curate:
    name: Scan & Curate Top Download Managers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Curator Scanner
        id: scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/curator.py

      - name: Create Pull Request with Candidates
        if: steps.scanner.outputs.found == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(curator): monthly verified download manager findings"
          title: "🤖 [Curator] Monthly Top-Star Candidates Radar"
          body-path: curator_summary.md
          branch: curator/monthly-radar
          delete-branch: true
