name: Awesome Radar & Trending Curator

on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at 00:00 UTC
  workflow_dispatch:     # Allows manual on-demand trigger anytime

permissions:
  contents: write
  pull-requests: write

jobs:
  curate:
    name: Scan & Spotlight Top Trending Managers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Autonomous Curator
        id: scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/curator.py

      - name: Create Pull Request with Spotlight Findings
        if: steps.scanner.outputs.found == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(curator): verified trending and top-star download manager updates"
          title: "🤖 [Curator] Verified Trending & Top-Star Download Managers"
          body-path: curator_summary.md
          branch: curator/weekly-radar
          delete-branch: true
