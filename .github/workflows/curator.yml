name: Awesome Radar & Trending Curator

on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at 00:00 UTC
  workflow_dispatch:     # Allows manual on-demand trigger anytime

permissions:
  contents: read
  issues: write

jobs:
  curate:
    name: Scan & Spotlight Top Trending Managers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run Autonomous Curator
        id: scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/curator.py

      - name: Publish Radar Summary to Job Summary
        if: steps.scanner.outputs.found == 'true'
        run: |
          cat curator_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or Update Weekly Radar Issue
        if: steps.scanner.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_TITLE="🤖 [Curator] Weekly Radar Candidates"
          ISSUE_NUM=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE_NUM" ]; then
            gh issue edit "$ISSUE_NUM" --body-file curator_summary.md
            echo "Updated radar issue #$ISSUE_NUM"
          else
            gh issue create --title "$ISSUE_TITLE" --label "enhancement" --body-file curator_summary.md
          fi
