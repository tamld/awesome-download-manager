name: CI & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Schema, Drift & Link Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Schema, Axiom & Drift Tests
        run: |
          python -m unittest discover tests

      - name: Check README Drift
        run: |
          python scripts/build_readme.py --check

      - name: Verify Link Integrity with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress './README.md'
          fail: true
